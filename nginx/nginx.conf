server {
    listen 80;
    server_name raffaello.se www.raffaello.se;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name raffaello.se www.raffaello.se;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/woff2
        font/woff;

    client_max_body_size 20m;

    ssl_certificate     /etc/letsencrypt/live/raffaello.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raffaello.se/privkey.pem;
    include             /etc/nginx/options-ssl-nginx.conf;

    proxy_connect_timeout 75s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # ^~ beats the asset regex below so /static/admin/*.css reaches Django/WhiteNoise
    location ^~ /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # ^~ beats the asset regex below so /media/*.webp is not sent to the frontend
    location ^~ /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }

    # Long-cache static assets served via the frontend container
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff|woff2|ico|mp4|webm)$ {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
