name: Diagnose and repair site

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose static and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /root/raffaello.restaurang
            echo '=== nginx static location ==='
            grep -n static nginx/nginx.conf || true
            echo '=== curl via host ==='
            curl -sI http://127.0.0.1/static/admin/css/base.css | head -n 15 || true
            echo '=== curl backend container ==='
            docker compose exec -T backend python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/static/admin/css/base.css'); print(r.status, r.headers.get('Content-Type'), len(r.read()))" || true
            echo '=== staticfiles sample ==='
            docker compose exec -T backend ls -la /app/staticfiles/admin/css/ 2>&1 | head -n 30 || true
            echo '=== collectstatic ==='
            docker compose exec -T backend python manage.py collectstatic --noinput -v 1 2>&1 | tail -n 30
            echo '=== retry ==='
            curl -sI http://127.0.0.1/static/admin/css/base.css | head -n 15 || true
            curl -sI https://127.0.0.1/static/admin/css/base.css -k | head -n 15 || true
