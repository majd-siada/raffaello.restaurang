name: Diagnose and repair site

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest and restart nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /root/raffaello.restaurang
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d nginx
            sleep 4
            docker compose ps -a nginx
            docker compose logs nginx --tail 30
            curl -sI --connect-timeout 5 http://127.0.0.1/ | head -n 5 || true
            curl -skI --connect-timeout 5 https://127.0.0.1/ | head -n 8 || true
